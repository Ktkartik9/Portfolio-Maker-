<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolia Builder — SaaS Workspace</title>
  <meta name="description" content="Build and customize your personal portfolio with live preview, responsive device frames, and instant local export." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/builder.css" />
  <link rel="stylesheet" href="css/templates.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="builder-root">
    <!-- Builder Top Application Header -->
    <header class="builder-header">
      <div class="header-brand-wrap">
        <button type="button" class="btn-icon" id="mobile-sidebar-toggle" title="Toggle Navigation Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <a href="index.html" class="brand-logo" style="font-size: 1.2rem;">
          <div class="brand-logo-icon" style="width: 32px; height: 32px; font-size: 0.95rem;">
            <i class="fa-solid fa-layer-group"></i>
          </div>
          <span>Portfolia</span>
        </a>
        <a href="index.html" class="back-home-link">
          <i class="fa-solid fa-chevron-left"></i> Home
        </a>
      </div>

      <div class="header-center-actions">
        <!-- Save Status Indicator -->
        <div id="save-status" class="save-status-indicator">
          <i class="fa-solid fa-check text-success"></i> Saved
        </div>

        <!-- Viewport Device Switcher -->
        <div class="device-switcher">
          <button type="button" class="device-btn active" data-device="desktop" title="Desktop Mode">
            <i class="fa-solid fa-desktop"></i> Desktop
          </button>
          <button type="button" class="device-btn" data-device="tablet" title="Tablet Mode">
            <i class="fa-solid fa-tablet-screen-button"></i> Tablet
          </button>
          <button type="button" class="device-btn" data-device="mobile" title="Mobile Mode">
            <i class="fa-solid fa-mobile-screen-button"></i> Mobile
          </button>
          <button type="button" class="device-btn" data-device="fullscreen" title="Fullscreen Preview">
            <i class="fa-solid fa-expand"></i> Fullscreen
          </button>
        </div>
      </div>

      <div class="header-right-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="load-demo-btn" title="Populate realistic sample portfolio data">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Load Demo
        </button>

        <button type="button" class="btn btn-outline btn-sm" id="export-json-btn" title="Download portfolio data as JSON">
          <i class="fa-solid fa-download"></i> Export JSON
        </button>

        <label for="import-json-input" class="btn btn-outline btn-sm" style="margin: 0; cursor: pointer;" title="Upload portfolio data JSON file">
          <i class="fa-solid fa-upload"></i> Import JSON
        </label>
        <input type="file" id="import-json-input" accept=".json,application/json" style="display: none;" />

        <button type="button" class="btn btn-primary btn-sm" id="print-pdf-btn" title="Export portfolio as PDF / Print">
          <i class="fa-solid fa-print"></i> Export PDF
        </button>

        <button type="button" class="btn-icon" id="reset-portfolio-btn" title="Reset all portfolio data to empty">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </header>

    <!-- Builder Workspace Split Grid -->
    <div class="builder-workspace">
      <!-- Sidebar Navigation -->
      <aside class="builder-sidebar" id="builder-sidebar">
        <div class="sidebar-nav-title">CONTENT EDITOR</div>
        
        <a class="sidebar-nav-item active" data-section="profile">
          <i class="fa-solid fa-user-circle"></i> Profile
        </a>
        <a class="sidebar-nav-item" data-section="skills">
          <i class="fa-solid fa-code"></i> Skills
        </a>
        <a class="sidebar-nav-item" data-section="education">
          <i class="fa-solid fa-graduation-cap"></i> Education
        </a>
        <a class="sidebar-nav-item" data-section="experience">
          <i class="fa-solid fa-briefcase"></i> Experience
        </a>
        <a class="sidebar-nav-item" data-section="projects">
          <i class="fa-solid fa-rocket"></i> Projects
        </a>
        <a class="sidebar-nav-item" data-section="certifications">
          <i class="fa-solid fa-award"></i> Certifications
        </a>
        <a class="sidebar-nav-item" data-section="social">
          <i class="fa-solid fa-share-nodes"></i> Social Links
        </a>

        <div class="sidebar-nav-title" style="margin-top: 16px;">DESIGN & LAYOUT</div>
        
        <a class="sidebar-nav-item" data-section="theme">
          <i class="fa-solid fa-palette"></i> Theme & Customization
        </a>
        <a class="sidebar-nav-item" data-section="order">
          <i class="fa-solid fa-up-down-left-right"></i> Section Order
        </a>
      </aside>

      <!-- Main Editor Form Panel -->
      <main class="builder-editor-panel" id="builder-editor-panel">
        <div id="editor-form-container">
          <!-- Dynamic form content injected by builder.js -->
        </div>
      </main>

      <!-- Live Preview Viewport Panel -->
      <section class="builder-preview-panel">
        <div class="preview-frame-wrapper frame-desktop" id="preview-frame-wrapper">
          <div id="portfolio-preview-target">
            <!-- Dynamic Portfolio rendered here by preview.js -->
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- App Script Entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
